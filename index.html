<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отчёт бригады</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; }
    input, button { width: 100%; margin: 8px 0; padding: 10px; font-size: 16px; }
    .error { color: red; font-size: 14px; }
  </style>
</head>
<body>

<h3>Отчёт бригады</h3>

<input list="models" id="model" placeholder="Модель изделия">
<datalist id="models"></datalist>
<div id="modelError" class="error"></div>

<input id="size" placeholder="Размер">
<input id="qty" type="number" placeholder="Количество">
<input id="brigade" placeholder="№ бригады">
<input id="people" type="number" placeholder="Людей в бригаде">

<button onclick="send()">Отправить</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby5MyqWh8toDBpG_M8cZ6gNaB86IY6LrZ6qYJbLX4bbNGWx6umsyndLhczy31m_JAW8Kg/exec';

let models = [];

fetch(SCRIPT_URL + '?action=models')
  .then(r => r.json())
  .then(data => {
    models = data;
    const dl = document.getElementById('models');
    data.forEach(m => {
      const o = document.createElement('option');
      o.value = m;
      dl.appendChild(o);
    });
  });

document.getElementById('model').addEventListener('input', e => {
  const val = e.target.value;
  document.getElementById('modelError').textContent =
    models.includes(val) ? '' : '❌ Такой модели нет';
});

function send() {
  const payload = {
    telegram_id: tg.initDataUnsafe?.user?.id,
    model: model.value,
    size: size.value,
    qty: qty.value,
    brigade: brigade.value,
    people: people.value
  };

  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  }).then(() => {
    tg.showAlert('Сохранено ✅');
  });
}
</script>

</body>
</html>
