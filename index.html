<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Размерная сетка</title>
<style>
body { font-family: sans-serif; padding: 20px; }
h2 { margin-bottom: 16px; }
.size-row { display: flex; align-items: center; justify-content: flex-start; flex-wrap: wrap; }
.size-item { display: flex; flex-direction: column; align-items: center; margin: 5px; }
.size-item input[type="number"] { width: 50px; text-align: center; font-size: 16px; }
.size-item input[type="checkbox"] { margin-bottom: 4px; transform: scale(1.5); }
.size-item input[type="number"]:disabled { background: #eee; }
button { margin-top: 20px; padding: 10px 20px; font-size: 16px; }
pre { background: #f4f4f4; padding: 10px; }
</style>
</head>
<body>

<h2>Размерная сетка</h2>

<div class="size-row" id="sizeRow"></div>

<button id="submitBtn">Посмотреть JSON</button>

<h3>JSON для отправки:</h3>
<pre id="jsonOutput">{}</pre>

<script>
// Диапазон размеров
const sizes = [48,50,52,54,56,58,60,62,64];
const sizeRow = document.getElementById('sizeRow');

// Генерация элементов
sizes.forEach(size=>{
  const div = document.createElement('div');
  div.className = 'size-item';
  
  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.checked = true;
  checkbox.id = `chk-${size}`;
  
  const label = document.createElement('label');
  label.textContent = size;
  label.htmlFor = checkbox.id;
  
  const input = document.createElement('input');
  input.type = 'number';
  input.min = 0;
  input.value = 0;
  input.id = `qty-${size}`;
  
  // Деактивация поля при снятой галочке
  checkbox.addEventListener('change', ()=>{
    input.disabled = !checkbox.checked;
    if(!checkbox.checked) input.value = 0;
  });
  
  // Деактивация, если введен 0
  input.addEventListener('input', ()=>{
    if(parseInt(input.value) === 0) checkbox.checked = false;
    else checkbox.checked = true;
  });
  
  div.appendChild(checkbox);
  div.appendChild(label);
  div.appendChild(input);
  sizeRow.appendChild(div);
});

// Кнопка показать JSON
document.getElementById('submitBtn').addEventListener('click', ()=>{
  const output = {};
  sizes.forEach(size=>{
    const chk = document.getElementById(`chk-${size}`);
    const qty = parseInt(document.getElementById(`qty-${size}`).value) || 0;
    if(chk.checked && qty > 0) output[size] = qty;
  });
  document.getElementById('jsonOutput').textContent = JSON.stringify(output, null, 2);
});
</script>

</body>
</html>
