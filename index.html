<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка моделей</title>
<style>
body { font-family: sans-serif; padding: 16px; }
pre { background: #f4f4f4; padding: 10px; max-height: 300px; overflow: auto; }
select, button { font-size: 16px; margin: 4px 0; padding: 6px; }
</style>
</head>
<body>

<h2>Проверка моделей</h2>

<label>Type:</label>
<select id="typeSelect"><option value="">Выберите тип</option></select>

<label>Model:</label>
<select id="modelSelect"><option value="">Выберите модель</option></select>

<label>Design:</label>
<select id="designSelect"><option value="">Выберите дизайн</option></select>

<button id="showAll">Показать весь JSON</button>

<h3>JSON моделей:</h3>
<pre id="jsonOutput">{}</pre>

<script>
const typeSelect = document.getElementById('typeSelect');
const modelSelect = document.getElementById('modelSelect');
const designSelect = document.getElementById('designSelect');
const jsonOutput = document.getElementById('jsonOutput');

let rawModels = []; // сюда загрузим JSON
let modelStructure = {};

// Для теста вставляем твой JSON напрямую
rawModels = [{"Type":"1","Model":"11619","Design":"1"},{"Type":"1","Model":"11619","Design":"2"},{"Type":"1","Model":"11619","Design":"3"},{"Type":"1","Model":"11619","Design":"4"},{"Type":"1","Model":"11619","Design":"5"},{"Type":"1","Model":"11619","Design":"6"},{"Type":"1","Model":"11619","Design":"16"},{"Type":"1","Model":"11647","Design":"1"},{"Type":"1","Model":"11711","Design":"1"},{"Type":"1","Model":"11711","Design":"2"},{"Type":"1","Model":"11720","Design":"4"},{"Type":"1","Model":"11720","Design":"7"},{"Type":"1","Model":"11736","Design":"1"},{"Type":"1","Model":"11736","Design":"3"},{"Type":"1","Model":"11736","Design":"4"},{"Type":"1","Model":"11736","Design":"5"},{"Type":"1","Model":"11736","Design":"6"},{"Type":"1","Model":"11736","Design":"7"}];

// строим структуру Type → Model → Design
function buildStructure(){
  modelStructure = {};
  rawModels.forEach(item=>{
    const type = item.Type;
    const model = item.Model;
    const design = item.Design;
    if(!modelStructure[type]) modelStructure[type] = {};
    if(!modelStructure[type][model]) modelStructure[type][model] = [];
    modelStructure[type][model].push(design);
  });
}

// заполнение селектов
function populateDropdowns(){
  // Type
  typeSelect.innerHTML = '<option value="">Выберите тип</option>';
  Object.keys(modelStructure).sort().forEach(t=>{
    const o = document.createElement('option'); o.value=t; o.textContent=t;
    typeSelect.appendChild(o);
  });
  // Model
  updateModelOptions();
  // Design
  updateDesignOptions();
}

function updateModelOptions(){
  const selectedType = typeSelect.value;
  modelSelect.innerHTML = '<option value="">Выберите модель</option>';
  let models = [];
  if(selectedType) models = Object.keys(modelStructure[selectedType]);
  else models = [...new Set(rawModels.map(m=>m.Model))];
  models.sort().forEach(m=>{
    const o = document.createElement('option'); o.value=m; o.textContent=m;
    modelSelect.appendChild(o);
  });
}

function updateDesignOptions(){
  const t = typeSelect.value;
  const m = modelSelect.value;
  designSelect.innerHTML = '<option value="">Выберите дизайн</option>';
  let designs = [];
  if(t && m) designs = modelStructure[t][m];
  else if(m) designs = rawModels.filter(x=>x.Model===m).map(x=>x.Design);
  else if(t) designs = Object.values(modelStructure[t]).flat();
  else designs = rawModels.map(x=>x.Design);
  [...new Set(designs)].sort().forEach(d=>{
    const o = document.createElement('option'); o.value=d; o.textContent='/' + d;
    designSelect.appendChild(o);
  });
}

// события
typeSelect.addEventListener('change', ()=>{
  updateModelOptions();
  updateDesignOptions();
});
modelSelect.addEventListener('change', updateDesignOptions);

// кнопка показать JSON
document.getElementById('showAll').addEventListener('click', ()=>{
  console.log("Raw Models:", rawModels);
  console.log("Model Structure:", modelStructure);
  jsonOutput.textContent = JSON.stringify(rawModels, null, 2);
});

// инициализация
buildStructure();
populateDropdowns();
</script>

</body>
</html>
