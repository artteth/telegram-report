<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчёт бригады</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  body { font-family: sans-serif; padding: 16px; }
  h3 { margin-bottom: 16px; }
  select, input, button { width: 100%; margin: 8px 0; padding: 10px; font-size: 16px; }
  #qr-reader { width: 100%; margin: 12px 0; display: none; }
</style>
</head>
<body>

<h3>Отчёт бригады</h3>

<label>Тип изделия</label>
<select id="typeSelect">
  <option value="">Выберите тип</option>
</select>

<label>Номер модели</label>
<select id="modelSelect" disabled>
  <option value="">Сначала выберите тип</option>
</select>

<label>Дизайн</label>
<select id="designSelect" disabled>
  <option value="">Сначала выберите модель</option>
</select>

<input id="size" placeholder="Размер">
<input id="qty" type="number" placeholder="Количество">
<input id="brigade" placeholder="№ бригады">
<input id="people" type="number" placeholder="Людей в бригаде">

<button id="scanBtn">📷 Сканировать код</button>
<div id="qr-reader"></div>

<button id="sendBtn" disabled>Отправить</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby5MyqWh8toDBpG_M8Z6gNaB86IY6LrZ6gJbLX4bbNGWx6umsyndLhczy31m_JAW8Kg/exec';

let rawModels = [];
let modelStructure = {};

const typeSelect = document.getElementById('typeSelect');
const modelSelect = document.getElementById('modelSelect');
const designSelect = document.getElementById('designSelect');
const scanBtn = document.getElementById('scanBtn');
const qrReaderDiv = document.getElementById('qr-reader');
const size = document.getElementById('size');
const qty = document.getElementById('qty');
const brigade = document.getElementById('brigade');
const people = document.getElementById('people');
const sendBtn = document.getElementById('sendBtn');

// Загрузка моделей из Google Таблицы
fetch(SCRIPT_URL + '?action=models')
  .then(r => r.json())
  .then(data => {
    rawModels = data.filter(v => v);
    buildModelStructure();
    populateTypes();
  })
  .catch(err => console.error("Ошибка загрузки моделей:", err));

// Формируем структуру {Type: {Model: [Design]}}
function buildModelStructure() {
  modelStructure = {};
  rawModels.forEach(item => {
    const type = item.Type.toString();
    const model = item.Model.toString();
    const design = item.Design.toString();
    if (!modelStructure[type]) modelStructure[type] = {};
    if (!modelStructure[type][model]) modelStructure[type][model] = [];
    modelStructure[type][model].push(design);
  });
  console.log("modelStructure:", modelStructure);
}

// Заполняем выпадающий список типов
function populateTypes() {
  Object.keys(modelStructure).sort().forEach(t => {
    const o = document.createElement('option');
    o.value = t;
    o.textContent = t;
    typeSelect.appendChild(o);
  });
}

// Выбор типа
typeSelect.addEventListener('change', () => {
  const type = typeSelect.value;
  modelSelect.innerHTML = '<option value="">Выберите модель</option>';
  designSelect.innerHTML = '<option value="">Сначала выберите модель</option>';
  designSelect.disabled = true;

  if (!type) {
    modelSelect.disabled = true;
    validateForm();
    return;
  }

  modelSelect.disabled = false;
  Object.keys(modelStructure[type]).sort().forEach(m => {
    const o = document.createElement('option');
    o.value = m;
    o.textContent = m;
    modelSelect.appendChild(o);
  });

  validateForm();
});

// Выбор модели
modelSelect.addEventListener('change', () => {
  const type = typeSelect.value;
  const model = modelSelect.value;
  designSelect.innerHTML = '<option value="">Выберите дизайн</option>';

  if (!model) {
    designSelect.disabled = true;
    validateForm();
    return;
  }

  designSelect.disabled = false;
  modelStructure[type][model].sort().forEach(d => {
    const o = document.createElement('option');
    o.value = d;
    o.textContent = '/' + d;
    designSelect.appendChild(o);
  });

  validateForm();
});

// Выбор дизайна
designSelect.addEventListener('change', validateForm);

// Проверка формы
function validateForm() {
  const valid = typeSelect.value && modelSelect.value && designSelect.value &&
                size.value.trim() && qty.value && brigade.value.trim() && people.value;
  sendBtn.disabled = !valid;
}

[size.id, qty.id, brigade.id, people.id].forEach(id => {
  document.getElementById(id).addEventListener('input', validateForm);
});

// Отправка данных на Google Таблицу
sendBtn.addEventListener('click', () => {
  const payload = {
    telegram_id: tg.initDataUnsafe?.user?.id,
    model: `${typeSelect.value}-${modelSelect.value}/${designSelect.value}`,
    size: size.value,
    qty: qty.value,
    brigade: brigade.value,
    people: people.value
  };

  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  }).then(() => {
    tg.showAlert('Сохранено ✅');
    typeSelect.value = '';
    modelSelect.innerHTML = '<option value="">Сначала выберите тип</option>';
    modelSelect.disabled = true;
    designSelect.innerHTML = '<option value="">Сначала выберите модель</option>';
    designSelect.disabled = true;
    size.value = '';
    qty.value = '';
    brigade.value = '';
    people.value = '';
    validateForm();
  });
});

// Сканирование QR/штрих-кода
scanBtn.addEventListener('click', () => {
  qrReaderDiv.style.display = 'block';
  scanBtn.disabled = true;
  const html5QrcodeScanner = new Html5Qrcode("qr-reader");
  html5QrcodeScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    decodedText => {
      const match = decodedText.match(/^(\d+)-(\d+)\/(\d+)$/);
      if (match) {
        const [_, type, model, design] = match;
        typeSelect.value = type; typeSelect.dispatchEvent(new Event('change'));
        modelSelect.value = model; modelSelect.dispatchEvent(new Event('change'));
        designSelect.value = design;
        validateForm();
      } else {
        alert('Некорректный код');
      }
      html5QrcodeScanner.stop();
      qrReaderDiv.style.display = 'none';
      scanBtn.disabled = false;
    },
    errorMessage => {}
  );
});
</script>
</body>
</html>
