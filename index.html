<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчёт бригады</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body { font-family: sans-serif; padding: 16px; }
button, input { width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; }
.selector { background: #f2f2f2; text-align: left; }
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
}
.modal {
  background: #fff;
  position: absolute;
  left: 0; right: 0; bottom: 0;
  max-height: 70%;
  overflow: auto;
  padding: 12px;
  border-radius: 12px 12px 0 0;
}
.option {
  padding: 14px;
  border-bottom: 1px solid #eee;
}
.option:active { background: #eee; }
</style>
</head>

<body>
<h3>Отчёт бригады</h3>

<button id="typeBtn" class="selector">Type: выбрать</button>
<button id="modelBtn" class="selector" disabled>Model: выбрать</button>
<button id="designBtn" class="selector" disabled>Design: выбрать</button>

<input id="brigade" placeholder="№ бригады">
<input id="people" type="number" placeholder="Людей в бригаде">

<button onclick="send()">Отправить</button>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_sM-VQz2gzU1wPE0kgOuXWUDyX40kIjkfOT_l4d1s25Bxtx3Qko_pXo8MUwRDanWlLQ/exec';

let catalog = {};
let currentType = '';
let currentModel = '';
let currentDesign = '';

const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');

fetch(SCRIPT_URL + '?action=catalog')
  .then(r => r.json())
  .then(data => catalog = data);

function openList(title, items, onSelect) {
  modal.innerHTML = `<h4>${title}</h4>`;
  items.forEach(v => {
    const d = document.createElement('div');
    d.className = 'option';
    d.textContent = v;
    d.onclick = () => {
      overlay.style.display = 'none';
      onSelect(v);
    };
    modal.appendChild(d);
  });
  overlay.style.display = 'block';
}

overlay.onclick = e => {
  if (e.target === overlay) overlay.style.display = 'none';
};

typeBtn.onclick = () => {
  openList('Тип изделия', Object.keys(catalog), v => {
    currentType = v;
    typeBtn.textContent = 'Type: ' + v;
    modelBtn.disabled = false;
    designBtn.disabled = true;
    modelBtn.textContent = 'Model: выбрать';
    designBtn.textContent = 'Design: выбрать';
  });
};

modelBtn.onclick = () => {
  openList('Модель', Object.keys(catalog[currentType]), v => {
    currentModel = v;
    modelBtn.textContent = 'Model: ' + v;
    designBtn.disabled = false;
  });
};

designBtn.onclick = () => {
  openList('Дизайн', catalog[currentType][currentModel], v => {
    currentDesign = v;
    designBtn.textContent = 'Design: /' + v;
  });
};

function send() {
  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({
      type: currentType,
      model: currentModel,
      design: currentDesign,
      brigade: brigade.value,
      people: people.value,
      telegram_id: tg.initDataUnsafe?.user?.id
    })
  }).then(() => tg.showAlert('Сохранено ✅'));
}
</script>
</body>
</html>
