<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отчёт бригады</title>
<style>
body { font-family: sans-serif; padding: 16px; }
button, input { width: 100%; margin: 8px 0; padding: 12px; font-size: 16px; }
.selector { background: #f2f2f2; text-align: left; }
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
}
.modal {
  background: #fff;
  position: absolute;
  left: 0; right: 0; bottom: 0;
  max-height: 70%;
  overflow: auto;
  padding: 12px;
  border-radius: 12px 12px 0 0;
}
.option {
  padding: 14px;
  border-bottom: 1px solid #eee;
}
.option:active { background: #eee; }
</style>
</head>
<body>

<h3>Отчёт бригады</h3>

<button id="typeBtn" class="selector">Type: выбрать</button>
<button id="modelBtn" class="selector" disabled>Model: выбрать</button>
<button id="designBtn" class="selector" disabled>Design: выбрать</button>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
/* 🔹 ДАННЫЕ (потом подключим Google Script) */
const data = {
  "Футболка": {
    "FT-001": ["01", "02"],
    "FT-002": ["01"]
  },
  "Худи": {
    "HD-10": ["A", "B"]
  }
};

let currentType = '';
let currentModel = '';

const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');

function openList(title, items, onSelect) {
  modal.innerHTML = `<h4>${title}</h4>`;
  items.forEach(v => {
    const d = document.createElement('div');
    d.className = 'option';
    d.textContent = v;
    d.onclick = () => {
      overlay.style.display = 'none';
      onSelect(v);
    };
    modal.appendChild(d);
  });
  overlay.style.display = 'block';
}

overlay.onclick = e => {
  if (e.target === overlay) overlay.style.display = 'none';
};

/* TYPE */
typeBtn.onclick = () => {
  openList('Выберите Type', Object.keys(data), val => {
    currentType = val;
    typeBtn.textContent = 'Type: ' + val;
    modelBtn.textContent = 'Model: выбрать';
    designBtn.textContent = 'Design: выбрать';
    modelBtn.disabled = false;
    designBtn.disabled = true;
  });
};

/* MODEL */
modelBtn.onclick = () => {
  openList('Выберите Model', Object.keys(data[currentType]), val => {
    currentModel = val;
    modelBtn.textContent = 'Model: ' + val;
    designBtn.disabled = false;
  });
};

/* DESIGN */
designBtn.onclick = () => {
  openList(
    'Выберите Design',
    data[currentType][currentModel],
    val => designBtn.textContent = 'Design: /' + val
  );
};
</script>

</body>
</html>
