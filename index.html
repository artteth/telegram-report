<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Размерная сетка с одинаковым количеством</title>
<style>
body { font-family: sans-serif; padding: 20px; }
h2 { margin-bottom: 16px; }
.controls { margin-bottom: 10px; }
.size-row { display: flex; align-items: center; flex-wrap: wrap; }
.size-item { display: flex; flex-direction: column; align-items: center; margin: 5px; }
.size-item select { width: 50px; font-size: 16px; }
.size-item input[type="checkbox"] { margin-bottom: 4px; transform: scale(1.5); }
.size-item select:disabled { background: #eee; }
button { margin-top: 20px; padding: 10px 20px; font-size: 16px; }
pre { background: #f4f4f4; padding: 10px; }
</style>
</head>
<body>

<h2>Размерная сетка</h2>

<div class="controls">
  <label><input type="checkbox" id="sameQty" checked> Одинаковое количество для всех активных размеров</label>
</div>

<div class="size-row" id="sizeRow"></div>

<button id="submitBtn">Посмотреть JSON</button>

<h3>JSON для отправки:</h3>
<pre id="jsonOutput">{}</pre>

<script>
// Диапазон размеров
const sizes = [48,50,52,54,56,58,60,62,64];
const maxQty = 10;
const sizeRow = document.getElementById('sizeRow');
const sameQtyCheckbox = document.getElementById('sameQty');

// Генерация элементов
sizes.forEach(size=>{
  const div = document.createElement('div');
  div.className = 'size-item';
  
  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.checked = true;
  checkbox.id = `chk-${size}`;
  
  const label = document.createElement('label');
  label.textContent = size;
  label.htmlFor = checkbox.id;
  
  const select = document.createElement('select');
  select.id = `qty-${size}`;
  
  for(let i=0;i<=maxQty;i++){
    const option = document.createElement('option');
    option.value = i;
    option.textContent = i;
    select.appendChild(option);
  }
  
  // Деактивация select, если снята галочка
  checkbox.addEventListener('change', ()=>{
    select.disabled = !checkbox.checked;
    if(!checkbox.checked) select.value = 0;
    if(sameQtyCheckbox.checked && checkbox.checked){
      updateAllActive(select.value);
    }
  });
  
  // Изменение select
  select.addEventListener('change', ()=>{
    if(parseInt(select.value) > 0) checkbox.checked = true;
    else checkbox.checked = false;
    
    if(sameQtyCheckbox.checked){
      updateAllActive(select.value);
    }
  });
  
  div.appendChild(checkbox);
  div.appendChild(label);
  div.appendChild(select);
  sizeRow.appendChild(div);
});

// Функция обновления всех активных размеров при sameQty
function updateAllActive(value){
  sizes.forEach(size=>{
    const chk = document.getElementById(`chk-${size}`);
    const sel = document.getElementById(`qty-${size}`);
    if(chk.checked && sel !== document.activeElement){ // не меняем текущий select
      sel.value = value;
    }
  });
}

// Кнопка показать JSON
document.getElementById('submitBtn').addEventListener('click', ()=>{
  const output = {};
  sizes.forEach(size=>{
    const chk = document.getElementById(`chk-${size}`);
    const qty = parseInt(document.getElementById(`qty-${size}`).value) || 0;
    if(chk.checked && qty > 0) output[size] = qty;
  });
  document.getElementById('jsonOutput').textContent = JSON.stringify(output, null, 2);
});
</script>

</body>
</html>
